<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scratch 清單實驗室</title>
<style>
  :root {
    --bg: #f2f4f8;
    --card: #ffffff;
    --border: #e1e5ee;
    --ink: #1f2a44;
    --muted: #6b7489;
    --list: #ff661a;
    --list-dark: #db5200;
    --blue: #3d7ff5;
    --run: #155e83;
    --ok: #12a37a;
    --ok-bg: #e6f7f1;
    --bad: #d94848;
    --bad-bg: #fdecec;
    --wait: #a3abbd;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(20,30,60,.06), 0 4px 14px rgba(20,30,60,.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
  }
  button { font-family: inherit; }

  /* ---------- 頂部 ---------- */
  header {
    min-height: 60px; background: var(--card); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 24px; padding: 8px 24px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 28px; }
  .brand i {
    width: 46px; height: 46px; border-radius: 12px; background: var(--list);
    display: grid; place-items: center; color: #fff; font-style: normal; font-size: 24px;
  }
  .progress { flex: 1; display: flex; align-items: center; gap: 18px; min-width: 300px; max-width: 600px; }
  .progress .label { font-size: 28px; color: var(--muted); white-space: nowrap; }
  .progress .label b { color: var(--ink); font-size: 28px; }
  .bar { flex: 1; height: 12px; background: #e7eaf1; border-radius: 6px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 6px; transition: width .3s; }
  .score {
    font-size: 28px; color: var(--muted); white-space: nowrap;
    background: #fff7ef; border: 2px solid #ffd6b8; border-radius: 999px; padding: 6px 24px;
  }
  .score b { color: var(--list-dark); font-size: 28px; }
  #account { display: none; font-size: 13px; line-height: 1.4; text-align: right; color: var(--muted); }
  #syncStatus.ok { color: var(--ok); }
  #syncStatus.warn { color: #c77700; }
  #syncStatus.bad { color: var(--bad); }
  #dots { display: flex; gap: 5px; margin-left: auto; flex-wrap: wrap; align-items: flex-end; }
  .dotwrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .dpts { font-size: 11px; font-weight: 700; color: var(--ok); height: 14px; line-height: 14px; white-space: nowrap; }
  .dot {
    width: 26px; height: 26px; border-radius: 50%; font-size: 12px; border: none; cursor: pointer;
    display: grid; place-items: center; background: #e7eaf1; color: var(--muted);
  }
  .dot.done { background: var(--ok); color: #fff; }
  .dot.cur { background: var(--blue); color: #fff; box-shadow: 0 0 0 3px #cfe0ff; }
  .dot:disabled { cursor: not-allowed; opacity: .4; }
  .dot:disabled:not(.done) { background: repeating-linear-gradient(45deg, #e7eaf1 0 4px, #dfe3ec 4px 8px); }

  /* ---------- 主版面 ---------- */
  .layout {
    display: grid; grid-template-columns: 330px 1fr; gap: 20px;
    padding: 20px 24px; max-width: 1440px; margin: 0 auto;
  }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }

  /* ---------- 積木區 ---------- */
  .palette { padding: 18px 18px 22px; align-self: start; }
  .palette h2 { margin: 0; font-size: 16px; }
  .palette .sub { margin: 4px 0 4px; font-size: 13px; color: var(--muted); }
  .group { margin-top: 14px; }
  .group-title {
    font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: 1px;
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  }
  .group-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .group .blocks { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
  .group.plain { margin-top: 16px; }
  .group.plain .blocks { gap: 12px; }

  /* ---------- 右側 ---------- */
  .main { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

  .question { padding: 20px 24px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .question .q { flex: 1; min-width: 260px; }
  .meta { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
  .chip { background: var(--list); color: #fff; font-size: 13px; padding: 3px 10px; border-radius: 999px; font-weight: 700; }
  .pts { background: #eef2f9; color: var(--ink); font-size: 13px; padding: 3px 10px; border-radius: 999px; }
  .pts.got { background: var(--ok-bg); color: var(--ok); font-weight: 700; }
  .question h1 { margin: 8px 0 0; font-size: 24px; line-height: 1.4; }
  .question h1 em { font-style: normal; color: var(--list-dark); }
  #hint { margin: 10px 0 0; font-size: 14px; color: var(--muted); background: #fff8e6; border: 1px solid #f3e0a8;
          border-radius: 8px; padding: 8px 12px; display: none; }
  .actions { display: flex; gap: 10px; }
  #hintBtn { position: relative; }
  #hintBtn:hover::after, #hintBtn:focus-visible::after {
    content: attr(data-tip); position: absolute; bottom: calc(100% + 10px); left: 50%;
    transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 13px;
    padding: 7px 12px; border-radius: 8px; white-space: nowrap; z-index: 20; pointer-events: none;
    box-shadow: 0 4px 12px rgba(0,0,0,.2);
  }
  #hintBtn:hover::before, #hintBtn:focus-visible::before {
    content: ""; position: absolute; bottom: calc(100% + 4px); left: 50%; margin-left: -6px;
    border: 6px solid transparent; border-top-color: var(--ink); border-bottom: none; z-index: 20;
  }
  .btn {
    border: 1px solid var(--border); background: #fff; color: var(--ink);
    padding: 9px 16px; border-radius: 10px; font-size: 14px; cursor: pointer;
  }
  .btn:hover { background: #f6f8fc; }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }

  /* 三步驟流程 */
  .flow { display: grid; grid-template-columns: 1fr 36px 1.35fr 36px 1fr; align-items: stretch; }
  .flow.select-mode { grid-template-columns: 1fr; }
  .flow.select-mode .side, .flow.select-mode .connector { display: none; }
  .step { padding: 16px 18px 20px; display: flex; flex-direction: column; min-height: 360px; }
  .flow.select-mode .step { min-height: 300px; }
  .step-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .num {
    width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: #fff;
    display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none;
  }
  .step-head h3 { margin: 0; font-size: 17px; }
  .step-head small { margin-left: auto; font-size: 12px; color: var(--muted); }
  .step-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  .connector { display: grid; place-items: center; }
  .connector span {
    width: 30px; height: 30px; border-radius: 50%; background: #fff; border: 1px solid var(--border);
    display: grid; place-items: center; color: var(--muted); font-size: 18px; box-shadow: var(--shadow);
  }

  #slot {
    width: 100%; min-height: 110px; border: 2px dashed #c9d2e3; border-radius: 12px;
    background: #f8faff; padding: 12px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 10px;
    transition: background .15s, border-color .15s; overflow-x: auto;
  }
  .flow.select-mode #slot { min-height: 160px; align-content: center; }
  #slot .placeholder { color: var(--muted); font-size: 14px; text-align: center; line-height: 1.6; }
  #slot.over { border-color: var(--blue); background: #eaf2ff; }
  .slot-item { position: relative; display: inline-block; padding: 8px 10px; border-radius: 10px; }
  .slot-item.err { background: var(--bad-bg); box-shadow: 0 0 0 2px var(--bad); }
  .slot-item.dup { animation: dup .5s; }
  @keyframes dup { 0%, 100% { transform: none; } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .slot-item .del {
    position: absolute; top: -4px; right: -6px; width: 24px; height: 24px; padding: 0;
    border: 2px solid #fff; border-radius: 50%; background: #5c6478; color: #fff;
    font-size: 12px; line-height: 20px; cursor: pointer; display: none; z-index: 2;
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  .slot-item:hover .del, .slot-item:focus-within .del { display: block; }
  .slot-item .del:hover { background: var(--bad); }
  @media (hover: none) { .slot-item .del { display: block; } }

  .run-row { display: flex; gap: 12px; justify-content: center; width: 100%; }
  /* 執行／正確／錯誤／下一題 共用一個按鈕 */
  #actBtn {
    flex: 0 1 240px; height: 58px; border: none; border-radius: 12px;
    color: #fff; font-size: 22px; font-weight: 700; letter-spacing: 4px; white-space: nowrap;
    cursor: pointer; background: var(--run); box-shadow: 0 4px 0 #0c3d57;
  }
  #actBtn.next { background: var(--blue); box-shadow: 0 4px 0 #2a5fc0; }
  #actBtn.ok   { background: var(--ok);   box-shadow: 0 4px 0 #0b7a5a; animation: pop .3s; }
  #actBtn.bad  { background: var(--bad);  box-shadow: 0 4px 0 #a83232; animation: shake .4s; }
  #actBtn:not(:disabled):hover { filter: brightness(1.1); }
  #actBtn:not(:disabled):active { transform: translateY(2px); }
  #actBtn:disabled { cursor: default; }
  @keyframes pop { 0% { transform: scale(.92); } 60% { transform: scale(1.06); } 100% { transform: none; } }
  @keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  .qmark {
    width: 140px; height: 200px; border: 2px dashed #c9d2e3; border-radius: 12px;
    display: grid; place-items: center; font-size: 64px; color: #c3cada;
  }

  /* 判定結果 */
  .verdict { padding: 18px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: center; }
  .check {
    display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border-radius: 12px;
    border: 1px solid var(--border); height: 100%;
  }
  .check .icon {
    width: 32px; height: 32px; border-radius: 50%; flex: none;
    display: grid; place-items: center; color: #fff; font-weight: 700; background: var(--wait);
  }
  .check h4 { margin: 2px 0 4px; font-size: 15px; color: var(--muted); }
  .check p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.5; }
  .check.bad { background: var(--bad-bg); border-color: #f5c6c6; }
  .check.bad .icon { background: var(--bad); }
  .check.bad h4 { color: var(--bad); }
  .check.ok { background: var(--ok-bg); border-color: #b5e6d5; }
  .check.ok .icon { background: var(--ok); }
  .check.ok h4 { color: var(--ok); }

  /* ---------- 清單監視器 ---------- */
  .monitor {
    width: 180px; background: #e9f1ff; border: 1px solid #c8d3e6; border-radius: 8px;
    font-size: 14px; overflow: hidden;
  }
  .monitor .t { text-align: center; font-weight: 700; padding: 6px; background: #fff; border-bottom: 1px solid #c8d3e6; font-size: 13px; }
  .monitor .items { padding: 4px 6px; max-height: 300px; overflow-y: auto; }
  .monitor .it { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .monitor .i { width: 16px; text-align: right; font-weight: 700; color: var(--muted); font-size: 13px; }
  .monitor .v { flex: 1; background: var(--list); color: #fff; border-radius: 5px; padding: 3px 8px;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 25px; }
  .monitor .empty { text-align: center; color: var(--muted); padding: 14px 0; }
  .monitor .f {
    display: flex; justify-content: space-between; padding: 5px 10px; background: #fff;
    border-top: 1px solid #c8d3e6; font-weight: 700; font-size: 13px; color: var(--muted);
  }
  .hidden-note {
    width: 180px; border: 2px dashed #c8d3e6; border-radius: 8px; padding: 30px 8px;
    text-align: center; color: var(--muted); font-size: 13px; line-height: 1.6;
  }
  .bubble {
    position: relative; background: #fff; border: 2px solid #c8d3e6; border-radius: 12px;
    padding: 6px 18px; text-align: center; font-size: 20px; font-weight: 700; min-width: 60px;
  }
  .bubble small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -7px; width: 12px; height: 12px;
    background: #fff; border-right: 2px solid #c8d3e6; border-bottom: 2px solid #c8d3e6; transform: rotate(45deg);
  }

  /* ---------- 積木 ---------- */
  .block {
    position: relative; display: inline-flex; align-items: center; gap: 6px;
    background: var(--list); border: 1px solid var(--list-dark); color: #fff;
    font-size: 14px; padding: 6px 10px; min-height: 40px; white-space: nowrap;
    cursor: grab; user-select: none; touch-action: none;
  }
  #slot .block { cursor: default; touch-action: auto; --notch: #f8faff; }
  .slot-item.err .block { --notch: var(--bad-bg); }
  .block.cmd { border-radius: 5px; margin-top: 3px; }
  .block.cmd::before {
    content: ""; position: absolute; top: -1px; left: 14px; width: 20px; height: 6px;
    background: var(--notch, #fff); border: 1px solid var(--list-dark); border-top: none; border-radius: 0 0 4px 4px;
  }
  .block.cmd::after {
    content: ""; position: absolute; bottom: -7px; left: 14px; width: 20px; height: 6px;
    background: var(--list); border: 1px solid var(--list-dark); border-top: none; border-radius: 0 0 4px 4px; z-index: 1;
  }
  .block.rep { border-radius: 20px; min-height: 34px; padding: 4px 10px; }
  .block.bool {
    border: none; min-height: 34px; padding: 4px 22px;
    clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 14px 100%, 0 50%);
  }
  .palette .block:hover { filter: brightness(1.06); }
  .block.ghost {
    position: fixed; z-index: 1000; pointer-events: none; opacity: .9;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.25));
  }
  .block.running { box-shadow: 0 0 0 3px #ffe066, 0 0 12px 3px #ffbf00; }
  .block input {
    font: inherit; font-size: 13px; border: none; background: #fff; color: #575e75;
    border-radius: 14px; padding: 3px 10px; min-width: 28px; text-align: center; outline: none; cursor: text;
  }
  .block input:focus { box-shadow: 0 0 0 2px var(--blue); }
  .block input.err { box-shadow: 0 0 0 2px var(--bad); background: #fff3f3; }
  .block .dd { background: var(--list-dark); border-radius: 4px; padding: 2px 8px; font-size: 13px; }
  .block .dd::after { content: " ▾"; }

  /* ---------- 完成畫面 ---------- */
  #finish { display: none; max-width: 640px; margin: 40px auto; padding: 32px; text-align: center; }
  #finish h2 { font-size: 28px; color: var(--ok); margin: 0 0 4px; }
  #finish .total { font-size: 48px; font-weight: 700; color: var(--list-dark); margin: 8px 0; }
  #finish .total small { font-size: 20px; color: var(--muted); font-weight: 400; }
  #finish table { margin: 20px auto; border-collapse: collapse; font-size: 14px; width: 100%; }
  #finish th, #finish td { border-bottom: 1px solid var(--border); padding: 7px 10px; }
  #finish th { color: var(--muted); font-weight: 700; }
  #finish td.miss { color: var(--bad); }

  /* ---------- 響應式 ---------- */
  @media (max-width: 1100px) {
    .layout { grid-template-columns: 1fr; }
    .palette .groups { display: flex; flex-wrap: wrap; gap: 0 28px; }
  }
  @media (max-width: 820px) {
    .layout { padding: 16px; }
    .flow { grid-template-columns: 1fr; gap: 8px; }
    .connector span { transform: rotate(90deg); }
    .step { min-height: 0; }
    .verdict { grid-template-columns: 1fr; }
    #dots { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><i>≡</i>Scratch 清單實驗室</div>
  <div class="progress">
    <div class="label"><b id="qnumTop"></b> / 共 <span id="qtotal"></span> 題</div>
    <div class="bar"><span id="barFill"></span></div>
  </div>
  <div class="score">得分 <b id="scoreNow">0</b> / <span id="scoreMax"></span></div>
  <div id="account"><div id="accountEmail"></div><div id="syncStatus"></div></div>
  <div id="dots"></div>
</header>

<div class="layout" id="game">
  <aside class="card palette">
    <h2>積木區</h2>
    <p class="sub" id="paletteSub"></p>
    <div class="groups" id="palette"></div>
  </aside>

  <main class="main">
    <section class="card question">
      <div class="q">
        <div class="meta"><span class="chip" id="qcat"></span><span id="qnum"></span><span class="pts" id="qpts"></span></div>
        <h1 id="qtext"></h1>
        <div id="hint"></div>
      </div>
      <div class="actions">
        <button class="btn" id="hintBtn">💡 提示</button>
        <button class="btn" id="clearBtn">↺ 清除作答</button>
      </div>
    </section>

    <section class="flow" id="flow">
      <div class="card step side">
        <div class="step-head"><span class="num">1</span><h3>原始清單</h3></div>
        <div class="step-body" id="originBox"></div>
      </div>

      <div class="connector"><span>›</span></div>

      <div class="card step" id="answerCard">
        <div class="step-head"><span class="num" id="answerNum">2</span><h3>作答區</h3><small id="slotRule"></small></div>
        <div class="step-body">
          <div id="slot"></div>
          <div class="run-row">
            <button id="actBtn" class="next">下一題 ▶</button>
          </div>
        </div>
      </div>

      <div class="connector"><span>›</span></div>

      <div class="card step side">
        <div class="step-head"><span class="num">3</span><h3>結果清單</h3></div>
        <div class="step-body" id="resultBox"></div>
      </div>
    </section>

    <section class="card verdict">
      <div class="check" id="check1">
        <span class="icon">1</span>
        <div><h4></h4><p></p></div>
      </div>
      <div class="check" id="check2">
        <span class="icon">2</span>
        <div><h4></h4><p></p></div>
      </div>
    </section>
  </main>
</div>

<section class="card" id="finish">
  <h2>🎉 測驗結束</h2>
  <div class="total"><span id="finalScore"></span> <small>/ <span id="finalMax"></span> 分</small></div>
  <table id="summary"></table>
  <button class="btn primary" id="againBtn">再玩一次</button>
</section>

<script>
/* ================= 題目 =================
   type "change"：作答區只放 1 個積木，執行後清單必須等於 target
   type "query" ：作答區只放 1 個積木，回傳值必須等於 answer
   type "select"：作答區可放多個積木，必須剛好是 target 裡的所有積木
   accept：作答區可接受的積木與欄位（欄位依積木上由左到右的順序）
   points：配分。每答錯一次扣 1 分，答對最少得 2 分，沒答對 0 分        */
const BASE = ["中川", "麗子", "大原", "寺井", "麻里愛", "戶塚"];
const QUESTIONS = [
  /* ---------- 新增 ---------- */
  { cat: "新增", type: "change", start: BASE, text: "把「兩津」加到清單的最後面。",
    accept: [{ op: "add", args: ["兩津"] }, { op: "insert", args: ["兩津", "7"] }],
    target: [...BASE, "兩津"], hint: "添加 (兩津) 到 姓名清單" },
  { cat: "新增", type: "change", start: BASE, text: "把「兩津」放到清單的第 1 項，其他人往後移。",
    accept: [{ op: "insert", args: ["兩津", "1"] }],
    target: ["兩津", ...BASE], hint: "插入 (兩津) 到 姓名清單 的第 (1) 項" },
  { cat: "新增", type: "change", start: BASE, text: "把「兩津」插在「大原」和「寺井」的中間。",
    accept: [{ op: "insert", args: ["兩津", "4"] }],
    target: ["中川", "麗子", "大原", "兩津", "寺井", "麻里愛", "戶塚"],
    hint: "兩津要變成第幾項？插入 (兩津) 到 姓名清單 的第 (4) 項" },
  { cat: "新增", type: "change", start: BASE, text: "只能用「插入」積木，把「兩津」放到清單的最後面。",
    accept: [{ op: "insert", args: ["兩津", "7"] }],
    target: [...BASE, "兩津"], hint: "最後面是第「長度 + 1」項：插入 (兩津) 到 姓名清單 的第 (7) 項" },
  { cat: "新增", type: "change", start: [], text: "清單現在是空的，把「中川」加進清單。",
    accept: [{ op: "add", args: ["中川"] }, { op: "insert", args: ["中川", "1"] }],
    target: ["中川"], hint: "添加 (中川) 到 姓名清單" },

  /* ---------- 刪除 ---------- */

QUESTIONS.forEach((q) => { q.points = q.type === "select" ? 5 : 4; });
const MAX_SCORE = QUESTIONS.reduce((s, q) => s + q.points, 0);
const MIN_POINTS = 2;

/* ================= Scratch 規則 ================= */
function toNumber(v) {                       // Cast.toNumber
  if (typeof v === "number") return isNaN(v) ? 0 : v;
  const n = Number(v);
  return isNaN(n) ? 0 : n;
}
function isWhiteSpace(v) { return v === null || (typeof v === "string" && v.trim().length === 0); }
function compare(v1, v2) {                   // Cast.compare
  let n1 = Number(v1), n2 = Number(v2);
  if (n1 === 0 && isWhiteSpace(v1)) n1 = NaN;
  if (n2 === 0 && isWhiteSpace(v2)) n2 = NaN;
  if (isNaN(n1) || isNaN(n2)) {
    const s1 = String(v1).toLowerCase(), s2 = String(v2).toLowerCase();
    return s1 < s2 ? -1 : s1 > s2 ? 1 : 0;
  }
  return n1 - n2;
}
function toListIndex(index, length) {        // Cast.toListIndex（數字欄位只能輸入整數）
  const i = Math.floor(toNumber(index));
  return (i < 1 || i > length) ? null : i;
}

/* 執行一個積木，回傳 { list, visible, result, note } */
function execute(op, args, startList, startVisible = true) {
  const list = [...startList];
  let visible = startVisible, result, note = "";
  const outOfRange = (n) => { note = `第 ${n} 項超出範圍，清單沒有改變。`; };
  switch (op) {
    case "add": list.push(args[0]); break;
    case "delete": {
      const i = toListIndex(args[0], list.length);
      i === null ? outOfRange(args[0]) : list.splice(i - 1, 1);
      break;
    }
    case "deleteall": list.length = 0; break;
    case "insert": {
      const i = toListIndex(args[1], list.length + 1);
      i === null ? outOfRange(args[1]) : list.splice(i - 1, 0, args[0]);
      break;
    }
    case "replace": {
      const i = toListIndex(args[0], list.length);
      i === null ? outOfRange(args[0]) : (list[i - 1] = args[1]);
      break;
    }
    case "item": {
      const i = toListIndex(args[0], list.length);
      result = i === null ? "" : list[i - 1];
      break;
    }
    case "itemnum": {
      result = 0;
      for (let k = 0; k < list.length; k++) {
        if (compare(list[k], args[0]) === 0) { result = k + 1; break; }
      }
      break;
    }
    case "length": result = list.length; break;
    case "contains": result = list.some((v) => compare(v, args[0]) === 0); break;
    case "show": visible = true; break;
    case "hide": visible = false; break;
  }
  return { list, visible, result, note };
}

/* ================= 積木定義 ================= */
const L = { list: true };
const T = (v) => ({ input: "text", v });
const N = (v) => ({ input: "num", v });
const GROUPS = [
  { name: "新增", blocks: [
    { op: "add",       kind: "cmd",  parts: ["添加", T("thing"), "到", L] },
    { op: "insert",    kind: "cmd",  parts: ["插入", T("thing"), "到", L, "的第", N("1"), "項"] },
  ]},
  { name: "刪除", blocks: [
    { op: "delete",    kind: "cmd",  parts: ["刪除", L, "的第", N("1"), "項"] },
    { op: "deleteall", kind: "cmd",  parts: ["刪除", L, "的所有項目"] },
  ]},
  { name: "修改", blocks: [
    { op: "replace",   kind: "cmd",  parts: ["替換", L, "的第", N("1"), "項為", T("thing")] },
  ]},
  { name: "查詢", blocks: [
    { op: "item",      kind: "rep",  parts: [L, "的第", N("1"), "項"] },
    { op: "itemnum",   kind: "rep",  parts: [T("thing"), "在", L, "裡的項目編號"] },
    { op: "length",    kind: "rep",  parts: ["清單", L, "的長度"] },
    { op: "contains",  kind: "bool", parts: ["清單", L, "包含", T("thing"), "?"] },
  ]},
  { name: "顯示", blocks: [
    { op: "show",      kind: "cmd",  parts: ["清單", L, "顯示"] },
    { op: "hide",      kind: "cmd",  parts: ["清單", L, "隱藏"] },
  ]},
];
const BLOCKS = GROUPS.flatMap((g) => g.blocks);
const BY_OP = Object.fromEntries(BLOCKS.map((b) => [b.op, b]));
const OP_GROUP = Object.fromEntries(GROUPS.flatMap((g) => g.blocks.map((b) => [b.op, g.name])));
/* 選指令題用的積木（和 Scratch 積木區的順序一樣，不分組，避免洩漏答案） */
const SELECT_ORDER = ["add", "delete", "deleteall", "insert", "replace", "item", "itemnum", "length", "contains"];
const SELECT_LIST = "購物車";
const NORMAL_LIST = "姓名清單";

const $ = (id) => document.getElementById(id);
const measureCtx = document.createElement("canvas").getContext("2d");
function fitInput(inp) {
  measureCtx.font = "13px 'Microsoft JhengHei', Arial, sans-serif";
  inp.style.width = Math.max(28, measureCtx.measureText(inp.value || "").width + 22) + "px";
}

function makeBlock(def, values, listName) {
  const el = document.createElement("div");
  el.className = "block " + def.kind;
  el.dataset.op = def.op;
  el.dataset.list = listName;
  let k = 0;
  def.parts.forEach((p) => {
    if (typeof p === "string") {
      const s = document.createElement("span"); s.textContent = p; el.appendChild(s);
    } else if (p.list) {
      const s = document.createElement("span"); s.className = "dd"; s.textContent = listName; el.appendChild(s);
    } else {
      const inp = document.createElement("input");
      inp.value = values ? values[k] : p.v;
      k++;
      if (p.input === "num") {
        inp.inputMode = "numeric";
        inp.addEventListener("input", () => {
          const cleaned = inp.value.replace(/[^0-9-]/g, "").replace(/(?!^)-/g, "");
          if (cleaned !== inp.value) inp.value = cleaned;
        });
      }
      inp.addEventListener("input", () => { fitInput(inp); onAnswerEdited(el); });
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") inp.blur(); });
      inp.addEventListener("pointerdown", (e) => e.stopPropagation());
      fitInput(inp);
      el.appendChild(inp);
    }
  });
  return el;
}
const valuesOf = (el) => [...el.querySelectorAll("input")].map((i) => i.value);

/* ================= 狀態 ================= */
let qi = 0;
let answers = [];         // 作答區的積木：[{ def, el, item }]
let solved = [];          // 是否已答對
let wrong = [];           // 答錯次數（答對前）
let runs = [];            // 按執行的次數
let hintUsed = [];        // 答對前是否點開過提示（扣 1 分）
let paletteMode = null;
let part2 = false;        // 是否已進入第 21–24 題（進入後不能回第 1–20 題）

/* 第 1–20 題全部答對，才能進入第 21–24 題（第 1–20 題的積木區分組會洩漏答案） */
const PART1 = QUESTIONS.findIndex((q) => q.type === "select");
const part1Done = () => solved.slice(0, PART1).every(Boolean);
const canOpen = (k) => k < PART1 ? !part2 : part1Done();

const isSelect = () => QUESTIONS[qi].type === "select";
/* 這題目前最多可得幾分：配分 - 答錯次數 - 提示，最低 2 分 */
const maxNow = (k) => Math.max(MIN_POINTS, QUESTIONS[k].points - wrong[k] - (hintUsed[k] ? 1 : 0));
const scoreOf = (k) => solved[k] ? maxNow(k) : 0;
const totalScore = () => QUESTIONS.reduce((s, _, k) => s + scoreOf(k), 0);

/* ================= 積木區：拖曳或點一下 ================= */
function buildPalette(mode) {
  if (paletteMode === mode) return;
  paletteMode = mode;
  const pal = $("palette");
  pal.innerHTML = "";
  const addBlock = (box, def, listName) => {
    const el = makeBlock(def, null, listName);
    el.addEventListener("pointerdown", (e) => startPointer(e, def, el));
    box.appendChild(el);
  };
  if (mode === "select") {
    $("paletteSub").textContent = "把符合題目的積木全部拖到作答區，或點一下放入";
    const grp = document.createElement("div"); grp.className = "group plain";
    const box = document.createElement("div"); box.className = "blocks";
    SELECT_ORDER.forEach((op) => addBlock(box, BY_OP[op], SELECT_LIST));
    grp.appendChild(box);
    pal.appendChild(grp);
  } else {
    $("paletteSub").textContent = "拖曳積木到作答區，或點一下放入";
    GROUPS.forEach((g) => {
      const grp = document.createElement("div"); grp.className = "group";
      const t = document.createElement("div"); t.className = "group-title"; t.textContent = g.name;
      const box = document.createElement("div"); box.className = "blocks";
      g.blocks.forEach((def) => addBlock(box, def, NORMAL_LIST));
      grp.append(t, box);
      pal.appendChild(grp);
    });
  }
}

function startPointer(e, def, el) {
  if (e.button !== 0) return;
  e.preventDefault();
  const sx = e.clientX, sy = e.clientY;
  const rect = el.getBoundingClientRect();
  const offX = sx - rect.left, offY = sy - rect.top;
  let ghost = null;
  const slot = $("slot");
  const overDrop = (x, y) => {
    const r = $("answerCard").getBoundingClientRect();
    return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  };
  const move = (ev) => {
    if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 5) {
      ghost = makeBlock(def, valuesOf(el), el.dataset.list);
      ghost.classList.add("ghost");
      document.body.appendChild(ghost);
    }
    if (ghost) {
      ghost.style.left = ev.clientX - offX + "px";
      ghost.style.top = ev.clientY - offY + "px";
      slot.classList.toggle("over", overDrop(ev.clientX, ev.clientY));
    }
  };
  const up = (ev) => {
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    window.removeEventListener("pointercancel", up);
    slot.classList.remove("over");
    if (ghost) {
      ghost.remove();
      if (ev.type === "pointerup" && overDrop(ev.clientX, ev.clientY)) placeBlock(def, valuesOf(el), el.dataset.list);
    } else if (ev.type === "pointerup") {
      placeBlock(def, valuesOf(el), el.dataset.list);      // 沒拖動 = 點一下
    }
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
  window.addEventListener("pointercancel", up);
}

/* ================= 作答區 ================= */
const PLACEHOLDER = '<div class="placeholder">把左邊的積木拖到這裡<br>或直接點一下積木</div>';

function placeBlock(def, values, listName) {
  const slot = $("slot");
  if (isSelect()) {
    const dup = answers.find((a) => a.def.op === def.op);
    if (dup) {                                   // 同一個積木不重複放
      dup.item.classList.remove("dup"); void dup.item.offsetWidth; dup.item.classList.add("dup");
      return;
    }
  } else {
    answers = [];
    slot.innerHTML = "";
  }
  if (!answers.length) slot.innerHTML = "";
  const el = makeBlock(def, values, listName || NORMAL_LIST);
  const item = document.createElement("div");
  item.className = "slot-item";
  const del = document.createElement("button");
  del.className = "del";
  del.title = "刪除這個積木";
  del.setAttribute("aria-label", "刪除這個積木");
  del.textContent = "✕";
  const entry = { def, el, item };
  del.onclick = () => removeAnswer(entry);
  item.append(el, del);
  slot.appendChild(item);
  answers.push(entry);
  resetResult();
}

function removeAnswer(entry) {
  entry.item.remove();
  answers = answers.filter((a) => a !== entry);
  if (!answers.length) $("slot").innerHTML = PLACEHOLDER;
  resetResult();
}

function clearAnswer() {
  $("slot").innerHTML = PLACEHOLDER;
  answers = [];
  resetResult();
}

/* 作答區有積木 → 執行；按執行後顯示正確／錯誤 1 秒 → 下一題。作答區空的 → 下一題（可跳過） */
let actState = "next";
let flashTimer = null;
function setAction(state) {
  clearTimeout(flashTimer);
  actState = state;
  const b = $("actBtn");
  b.className = state;
  b.disabled = state === "ok" || state === "bad";
  b.textContent =
    state === "run" ? "▶ 執行" :
    state === "ok" ? "✓ 正確" :
    state === "bad" ? "✕ 錯誤" :
    qi === QUESTIONS.length - 1 ? "完成 ▶" : "下一題 ▶";
}
function onAction() {
  if (actState === "run") {
    const ok = run();
    setAction(ok ? "ok" : "bad");
    flashTimer = setTimeout(() => setAction("next"), 1000);
  } else if (actState === "next") {
    goNext();
  }
}

function onAnswerEdited(el) {
  if (answers.some((a) => a.el === el)) {
    el.querySelectorAll("input.err").forEach((i) => i.classList.remove("err"));
    resetResult();
  }
}

function setCheck(id, state, title, text) {
  const c = $(id);
  c.className = "check" + (state ? " " + state : "");
  c.querySelector(".icon").textContent = state === "ok" ? "✓" : state === "bad" ? "✕" : (id === "check1" ? "1" : "2");
  c.querySelector("h4").textContent = title;
  c.querySelector("p").textContent = text;
}

function resetResult() {
  answers.forEach((a) => a.item.classList.remove("err"));
  $("resultBox").innerHTML = '<div class="qmark">?</div>';
  if (isSelect()) {
    setCheck("check1", "", "① 作答區", "把所有符合的積木放進作答區後，按「執行」。");
    setCheck("check2", "", "② 得分", solved[qi] ? `這題已經答對，得 ${scoreOf(qi)} 分。` : "全部選對才得分。");
  } else {
    setCheck("check1", "", "① 作答區", "放好積木、填好白色欄位後，按「執行」。");
    setCheck("check2", "", "② 結果", "作答區正確後，才會檢查執行結果。");
  }
  setAction(answers.length ? "run" : "next");
}

/* 第一階段：檢查作答區的積木與欄位 */
function checkAnswerBlock(q, op, args) {
  const sameOp = q.accept.filter((a) => a.op === op);
  if (sameOp.length === 0) {
    const wantGroups = [...new Set(q.accept.map((a) => OP_GROUP[a.op]))];
    const sameGroup = wantGroups.includes(OP_GROUP[op]);
    return {
      ok: false,
      msg: sameGroup ? `「${OP_GROUP[op]}」類沒錯，但不是這個積木，換同一類的另一個積木試試。`
                     : `這題要用「${wantGroups.join("」或「")}」類的積木。`,
      bad: [],
    };
  }
  let best = null;                     // 錯誤最少的可接受答案
  for (const a of sameOp) {
    const bad = a.args.map((v, k) => (compare(args[k], v) === 0 ? -1 : k)).filter((k) => k >= 0);
    if (!best || bad.length < best.length) best = bad;
  }
  if (best.length === 0) return { ok: true };
  return { ok: false, msg: "積木選對了，但紅框的白色欄位填得不對。", bad: best };
}

function markWrong() {
  if (!solved[qi]) wrong[qi]++;
  renderPoints();
}
function markSolved() {
  const first = !solved[qi];
  if (first) solved[qi] = true;
  renderProgress();
  renderPoints();
  const count = solved.filter(Boolean).length;
  if (first && count % UPLOAD_EVERY === 0) syncScores();     // 每完成 5 題上傳一次
}

/* ================= 上傳成績到老師的試算表 =================
   只有透過 Google Apps Script 網頁應用程式開啟時才會上傳；
   直接開啟 HTML 檔（或放在 GitHub）時不會上傳，其他功能照常。 */
const UPLOAD_EVERY = 5;
const hasServer = typeof google !== "undefined" && !!google.script && !!google.script.run;
let userEmail = "";

function setSyncStatus(text, cls) {
  const el = $("syncStatus");
  el.textContent = text;
  el.className = cls || "";
}

function initAccount() {
  if (!hasServer) return;
  $("account").style.display = "block";
  setSyncStatus("讀取帳號中…");
  google.script.run
    .withSuccessHandler((email) => {
      userEmail = email;
      if (email) {
        $("accountEmail").textContent = "👤 " + email;
        setSyncStatus(`每完成 ${UPLOAD_EVERY} 題，成績會自動上傳`);
      } else {
        $("accountEmail").textContent = "⚠️ 未取得學校帳號";
        setSyncStatus("成績不會上傳，請改用學校帳號登入", "warn");
      }
    })
    .withFailureHandler(() => setSyncStatus("⚠️ 無法連線，成績不會上傳", "warn"))
    .getUserEmail();
}

function syncScores() {
  if (!hasServer || !userEmail) return;
  const data = {
    total: totalScore(),
    solved: solved.filter(Boolean).length,
    scores: QUESTIONS.map((_, k) => (solved[k] ? scoreOf(k) : "")),
  };
  setSyncStatus("☁️ 成績上傳中…");
  google.script.run
    .withSuccessHandler(() => setSyncStatus(`☁️ 已上傳：完成 ${data.solved} 題，${data.total} 分`, "ok"))
    .withFailureHandler((err) =>
      setSyncStatus("⚠️ 上傳失敗：" + (err && err.message ? err.message : "請檢查網路"), "bad"))
    .saveScores(data);
}
const penaltyNote = () => solved[qi] ? "" :
  `（答錯扣 1 分，這題目前最多可得 ${maxNow(qi)} 分）`;

/* 執行作答區的積木並判定；回傳 true＝正確、false＝錯誤 */
function run() {
  if (!answers.length) return false;
  const q = QUESTIONS[qi];
  answers.forEach((a) => {
    a.el.classList.add("running");
    setTimeout(() => a.el.classList.remove("running"), 350);
  });
  runs[qi]++;
  if (q.type === "select") return runSelect(q);

  const { def, el } = answers[0];
  const args = valuesOf(el);
  const r = execute(def.op, args, q.start);
  const resultOk = q.type === "change" ? sameList(r.list, q.target) : String(r.result) === q.answer;

  // 顯示結果（不論對錯）
  const box = $("resultBox");
  box.innerHTML = "";
  if (r.result !== undefined) {
    const b = document.createElement("div");
    b.className = "bubble";
    b.innerHTML = "<small>回傳值</small>";
    b.append(String(r.result) === "" ? "（空白）" : formatValue(r.result));
    box.appendChild(b);
  }
  if (r.visible) {
    box.appendChild(renderMonitor(r.list));
  } else {
    const h = document.createElement("div");
    h.className = "hidden-note";
    h.innerHTML = "清單被隱藏了<br>舞台上看不到";
    box.appendChild(h);
  }

  // 判定 ① 作答區
  const c1 = checkAnswerBlock(q, def.op, args);
  const inputs = el.querySelectorAll("input");
  inputs.forEach((i) => i.classList.remove("err"));
  if (!c1.ok) {
    markWrong();
    c1.bad.forEach((k) => inputs[k] && inputs[k].classList.add("err"));
    setCheck("check1", "bad", "① 作答區：不正確", (r.note ? r.note + " " : "") + c1.msg + penaltyNote());
    setCheck("check2", "", "② 結果：尚未判定", "作答區正確後，才會檢查執行結果。");
    return false;
  }
  setCheck("check1", "ok", "① 作答區：正確", "積木和欄位都對了。");

  // 判定 ② 結果
  if (!resultOk) {
    markWrong();
    setCheck("check2", "bad", "② 結果：不正確", (r.note || "執行結果不是題目要的。") + penaltyNote());
    return false;
  }
  markSolved();
  setCheck("check2", "ok", "② 結果：正確",
    (q.type === "change" ? "結果清單和題目要求一樣。" :
      `回傳值是 ${String(r.result) === "" ? "空白" : formatValue(r.result)}，答對了！`) +
    ` 這題得 ${scoreOf(qi)} 分。`);
  return true;
}

function runSelect(q) {
  const chosen = answers.map((a) => a.def.op);
  const extra = chosen.filter((op) => !q.target.includes(op));
  const missing = q.target.filter((op) => !chosen.includes(op));
  answers.forEach((a) => a.item.classList.toggle("err", extra.includes(a.def.op)));
  if (!extra.length && !missing.length) {
    markSolved();
    setCheck("check1", "ok", "① 作答區：正確", `全部選對了！這 ${q.target.length} 個都是「${q.cat}」指令。`);
    setCheck("check2", "ok", "② 得分", `這題得 ${scoreOf(qi)} 分。`);
    return true;
  }
  markWrong();
  const msg = [];
  if (extra.length) msg.push(`紅框的 ${extra.length} 個積木不是「${q.cat}」指令。`);
  if (missing.length) msg.push(`還少了 ${missing.length} 個「${q.cat}」指令。`);
  setCheck("check1", "bad", "① 作答區：不正確", msg.join(""));
  setCheck("check2", solved[qi] ? "ok" : "", "② 得分",
    solved[qi] ? `這題已經答對，得 ${scoreOf(qi)} 分。` : penaltyNote().replace(/[（）]/g, ""));
  return false;
}

/* 布林值加上中文說明 */
function formatValue(v) {
  if (v === true) return "true(是)";
  if (v === false) return "false(否)";
  return String(v);
}

function sameList(a, b) {
  return a.length === b.length && a.every((v, i) => String(v) === String(b[i]));
}

function renderMonitor(items) {
  const m = document.createElement("div");
  m.className = "monitor";
  const t = document.createElement("div"); t.className = "t"; t.textContent = NORMAL_LIST; m.appendChild(t);
  const body = document.createElement("div"); body.className = "items";
  if (items.length === 0) {
    const e = document.createElement("div"); e.className = "empty"; e.textContent = "（空的）"; body.appendChild(e);
  }
  items.forEach((v, k) => {
    const row = document.createElement("div"); row.className = "it";
    const idx = document.createElement("span"); idx.className = "i"; idx.textContent = k + 1;
    const val = document.createElement("span"); val.className = "v"; val.textContent = v;
    row.append(idx, val); body.appendChild(row);
  });
  m.appendChild(body);
  const f = document.createElement("div"); f.className = "f";
  f.innerHTML = `<span>+</span><span>長度 ${items.length}</span><span>=</span>`;
  m.appendChild(f);
  return m;
}

/* ================= 題目切換 ================= */
function emphasize(text) {
  const span = document.createElement("span");
  text.split(/(「[^」]+」)/).forEach((part) => {
    const m = part.match(/^「([^」]+)」$/);
    if (m) {
      span.append("「");
      const em = document.createElement("em"); em.textContent = m[1]; span.appendChild(em);
      span.append("」");
    } else span.append(part);
  });
  return span;
}

function loadQuestion(i) {
  if (!canOpen(i)) return;
  if (i >= PART1) part2 = true;
  qi = i;
  const q = QUESTIONS[i];
  const select = q.type === "select";
  buildPalette(select ? "select" : "normal");
  $("flow").classList.toggle("select-mode", select);
  $("answerNum").textContent = select ? "1" : "2";
  $("slotRule").textContent = select ? "可以放多個積木" : "只能放 1 個積木";
  $("qcat").textContent = select ? "認識指令" : q.cat;
  $("qnum").textContent = `第 ${i + 1} 題`;
  $("qtext").innerHTML = "";
  $("qtext").appendChild(emphasize(q.text));
  $("hint").style.display = "none";
  $("hint").textContent = "提示：" + q.hint;
  $("originBox").innerHTML = "";
  if (!select) $("originBox").appendChild(renderMonitor(q.start));
  answers = [];
  clearAnswer();
  renderProgress();
  renderPoints();
}

function renderPoints() {
  const q = QUESTIONS[qi];
  const p = $("qpts");
  if (solved[qi]) {
    p.className = "pts got";
    p.textContent = `已得 ${scoreOf(qi)} / ${q.points} 分`;
  } else {
    p.className = "pts";
    const parts = [`配分 ${q.points} 分`];
    if (wrong[qi]) parts.push(`已答錯 ${wrong[qi]} 次`);
    if (hintUsed[qi]) parts.push("已看提示");
    if (parts.length > 1) parts.push(`最多可得 ${maxNow(qi)} 分`);
    p.textContent = parts.join("・");
  }
  updateHintTip();
  $("scoreNow").textContent = totalScore();
}

function goNext() {
  if (qi === PART1 - 1) {                       // 第 20 題 → 第 21 題
    if (!part1Done()) {
      const left = QUESTIONS.slice(0, PART1).map((_, k) => k).filter((k) => !solved[k]);
      alert(`第 1–${PART1} 題要全部答對，才能進入第 ${PART1 + 1} 題。\n還沒答對：第 ${left.map((k) => k + 1).join("、")} 題`);
      loadQuestion(left[0]);
      return;
    }
    if (!confirm(`進入第 ${PART1 + 1} 題後，就不能再回到第 1–${PART1} 題。確定要繼續嗎？`)) return;
  }
  if (qi < QUESTIONS.length - 1) { loadQuestion(qi + 1); return; }
  const left = solved.filter((s) => !s).length;
  if (left && !confirm(`還有 ${left} 題沒有答對，沒答對的題目是 0 分。確定要結束測驗嗎？`)) return;
  showFinish();
}

function renderProgress() {
  $("qnumTop").textContent = `第 ${qi + 1} 題`;
  $("qtotal").textContent = QUESTIONS.length;
  $("scoreMax").textContent = MAX_SCORE;
  $("barFill").style.width = (solved.filter(Boolean).length / QUESTIONS.length * 100) + "%";
  const d = $("dots");
  d.innerHTML = "";
  QUESTIONS.forEach((_, k) => {
    const w = document.createElement("div");
    w.className = "dotwrap";
    const pts = document.createElement("span");
    pts.className = "dpts";
    pts.textContent = solved[k] ? `${scoreOf(k)}分` : "";
    const b = document.createElement("button");
    b.className = "dot" + (solved[k] ? " done" : "") + (k === qi ? " cur" : "");
    b.textContent = k + 1;
    b.disabled = !canOpen(k);
    b.title = b.disabled
      ? (k >= PART1 ? `第 1–${PART1} 題全部答對才能作答` : `已進入第 ${PART1 + 1}–${QUESTIONS.length} 題，不能再回來`)
      : solved[k] ? `第 ${k + 1} 題：得 ${scoreOf(k)} 分` : `第 ${k + 1} 題`;
    b.onclick = () => loadQuestion(k);
    w.append(pts, b);
    d.appendChild(w);
  });
}

function showFinish() {
  $("game").style.display = "none";
  $("finish").style.display = "block";
  window.scrollTo(0, 0);
  syncScores();                                              // 結束時再上傳一次最後成績
  $("finalScore").textContent = totalScore();
  $("finalMax").textContent = MAX_SCORE;
  $("summary").innerHTML =
    "<tr><th>題號</th><th>類別</th><th>配分</th><th>答錯次數</th><th>看提示</th><th>得分</th></tr>" +
    QUESTIONS.map((q, k) =>
      `<tr><td>${k + 1}</td><td>${q.type === "select" ? "認識指令：" + q.cat : q.cat}</td><td>${q.points}</td>` +
      `<td>${wrong[k]}</td><td>${hintUsed[k] ? "是" : ""}</td><td class="${solved[k] ? "" : "miss"}">${solved[k] ? scoreOf(k) : "未答對 0"}</td></tr>`
    ).join("");
}

function resetAll() {
  solved = QUESTIONS.map(() => false);
  wrong = QUESTIONS.map(() => 0);
  runs = QUESTIONS.map(() => 0);
  hintUsed = QUESTIONS.map(() => false);
  part2 = false;
}

$("actBtn").onclick = onAction;
$("clearBtn").onclick = clearAnswer;
function updateHintTip() {
  $("hintBtn").dataset.tip =
    solved[qi] ? "這題已經答對，看提示不扣分" :
    hintUsed[qi] ? "已經扣過 1 分，可以再次點開" :
    "點開提示會扣1分";
}
$("hintBtn").onclick = () => {
  const h = $("hint");
  const opening = h.style.display === "none";
  if (opening && !solved[qi] && !hintUsed[qi]) {
    hintUsed[qi] = true;
    renderPoints();
  }
  h.style.display = opening ? "block" : "none";
};
$("againBtn").onclick = () => {
  resetAll();
  $("finish").style.display = "none";
  $("game").style.display = "";
  loadQuestion(0);
  window.scrollTo(0, 0);
};

resetAll();
loadQuestion(0);
initAccount();
</script>
</body>
</html>
